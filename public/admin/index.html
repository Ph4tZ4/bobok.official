<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOBOK — Admin</title><link rel="stylesheet" href="/admin/style.css"></head><body><header><a href="/">bobok®</a><span>ADMIN CONSOLE</span><button id="logout" hidden>ออกจากระบบ</button></header><main><p id="notice" role="status"></p><section id="login-panel"><p>AUTHORIZED ACCESS</p><h1>เข้าสู่ระบบจัดการ</h1><form id="login"><label>อีเมล<input name="email" type="email" required autocomplete="username"></label><label>รหัสผ่าน<input name="password" type="password" required autocomplete="current-password"></label><button>เข้าสู่ระบบ ↗</button></form></section><section id="dashboard" hidden><nav><button data-tab="inquiries" aria-pressed="true">ผู้ติดต่อ</button><button data-tab="content" aria-pressed="false">ข้อความหน้าเว็บ</button></nav><div id="inquiries-panel"><div class="heading"><h1>รายการติดต่อ <small id="total"></small></h1><button id="refresh">รีเฟรช ↻</button></div><div id="inquiries"></div><div class="pagination"><button id="prev">← ก่อนหน้า</button><span id="page-label"></span><button id="next">ถัดไป →</button></div></div><div id="content-panel" hidden><h1>ข้อความหน้าเว็บ</h1><p>เว้นว่างเพื่อกลับไปใช้ข้อความตั้งต้น</p><form id="content-form"><label>หัวข้อหลักภาษาไทย<textarea name="hero_heading" maxlength="1500" rows="3"></textarea></label><label>คำอธิบายหน้าแรก<textarea name="hero_description" maxlength="1500" rows="3"></textarea></label><label>แนวคิดของเรา<textarea name="concept_description" maxlength="1500" rows="5"></textarea></label><label>ข้อความเชิญติดต่อ<textarea name="contact_description" maxlength="1500" rows="3"></textarea></label><button>บันทึกข้อความ ↗</button></form></div></section></main><script src="/admin/admin.js" defer></script></body></html>
